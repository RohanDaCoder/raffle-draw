name: build-release

# Every push to main: build the sheets, publish a GitHub Release with the
# PDF/HTML/preview attached (the preview image renders inside the release
# notes), and — when GitHub Pages is available for the repo — deploy the
# ticket-generator site (in-browser PDF generation, no login, plus the
# ready-made print files). Pages needs a public repo (or a paid plan for
# private repos) with Pages enabled; the workflow stays green without it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-v2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      pages_ok: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pillow pikepdf
          python -m playwright install chromium --with-deps

      - name: Generate raffle sheets
        run: |
          bash examples/make_class9d.sh
          bash examples/make_vip.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: build-${{ github.run_number }}
        run: |
          # allow re-runs of the same run number
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 && \
            gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag
          NOTES=$(cat <<EOF
          ![Page 1 preview](https://github.com/${REPO}/releases/download/${TAG}/preview.png)

          Auto-generated from commit \`${GITHUB_SHA}\`.

          | File | What it is |
          |---|---|
          | \`raffle_tickets.pdf\` | 12 A4 sheets, 480 standard tickets — print at 100% scale |
          | \`raffle_tickets.html\` | Self-contained printable HTML (standard) |
          | \`preview.png\` | Standard sheet, page 1 preview |
          | \`vip_tickets.pdf\` | VIP pre-order tickets (holder names, gold) — numbering continues after the standard run |
          | \`vip_tickets.html\` | Self-contained printable HTML (VIP) |
          | \`vip_preview.png\` | VIP sheet, page 1 preview |

          Live site: **https://${REPO%%/*}.github.io/${REPO#*/}/** — a full
          in-browser ticket generator (standard + VIP, custom counts and
          holders, PDFs made right on the phone) plus the ready-made files
          above. Requires GitHub Pages — public repo or paid plan; the preview
          image above works regardless.
          EOF
          )
          gh release create "$TAG" \
            dist/raffle_tickets.pdf dist/raffle_tickets.html dist/preview.png \
            dist/vip_tickets.pdf dist/vip_tickets.html dist/vip_preview.png \
            --repo "$REPO" \
            --title "Raffle sheets — build ${{ github.run_number }}" \
            --notes "$NOTES"

      - name: Prepare Pages site
        run: |
          mkdir -p site
          cp dist/raffle_tickets.html site/sheet.html
          cp dist/raffle_tickets.pdf   site/raffle_tickets.pdf
          cp dist/preview.png          site/preview.png
          cp dist/vip_tickets.html     site/vip.html
          cp dist/vip_tickets.pdf      site/vip_tickets.pdf
          cp dist/vip_preview.png      site/vip_preview.png
          # the in-browser generator (index.html + generator.js + vendored jsPDF)
          cp -r web/.                  site/
          # pre-order list feeding the VIP editor
          cp examples/vip_list.json    site/vip_list.json

      - name: Configure Pages
        id: pages
        continue-on-error: true   # not available on private free-plan repos
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.pages_ok == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
