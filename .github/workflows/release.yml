name: build-release

# Every push to main: build the sheets, publish a GitHub Release with the
# PDF/HTML/preview attached, and deploy a live-preview site to GitHub Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pillow pikepdf
          python -m playwright install chromium --with-deps

      - name: Generate raffle sheets
        run: bash examples/make_class9d.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: build-${{ github.run_number }}
        run: |
          # allow re-runs of the same run number
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 && \
            gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag
          NOTES=$(cat <<EOF
          ![Page 1 preview](https://github.com/${REPO}/releases/download/${TAG}/preview.png)

          Auto-generated from commit \`${GITHUB_SHA}\`.

          | File | What it is |
          |---|---|
          | \`raffle_tickets.pdf\` | 12 A4 sheets, 480 tickets — print at 100% scale |
          | \`raffle_tickets.html\` | Self-contained printable HTML (same sheets) |
          | \`preview.png\` | Page 1 preview image |

          Live preview: **https://${REPO%%/*}.github.io/${REPO#*/}/**
          EOF
          )
          gh release create "$TAG" \
            dist/raffle_tickets.pdf dist/raffle_tickets.html dist/preview.png \
            --repo "$REPO" \
            --title "Raffle sheets — build ${{ github.run_number }}" \
            --notes "$NOTES"

      - name: Prepare Pages site
        run: |
          mkdir -p site
          cp dist/raffle_tickets.html site/sheet.html
          cp dist/raffle_tickets.pdf   site/raffle_tickets.pdf
          cp dist/preview.png         site/preview.png
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Raffle Draw — Class 9 · Section D</title>
          <style>
            body { font-family: system-ui, sans-serif; margin: 0; padding: 32px 16px;
                   background: #f4f7fb; color: #12283f; }
            main { max-width: 860px; margin: auto; }
            h1 { font-size: 22px; margin: 0 0 4px; }
            p.sub { color: #46607a; margin-top: 0; }
            a.btn { display: inline-block; background: #1258a7; color: #fff; padding: 10px 18px;
                    border-radius: 6px; text-decoration: none; margin: 12px 8px 16px 0; }
            img { width: 100%; border: 1px solid #cbd7e6; border-radius: 8px;
                  box-shadow: 0 2px 14px rgba(18,52,84,.12); display: block; }
          </style>
          </head>
          <body>
          <main>
            <h1>Raffle Draw — Class 9 · Section D</h1>
            <p class="sub">480 tickets · Tk 10 · 12 A4 sheets · auto-built from the latest commit on main.</p>
            <a class="btn" href="raffle_tickets.pdf">Open PDF</a>
            <a class="btn" href="sheet.html">Printable HTML</a>
            <img src="preview.png" alt="Page 1 preview of the raffle ticket sheet">
          </main>
          </body>
          </html>
          EOF

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
